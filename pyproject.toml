[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decentralabs-fmu-executor"
version = "0.1.1"
description = "Shared FMI 2/3 Co-Simulation service for DecentraLabs stations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.1,<1",
  "uvicorn[standard]>=0.53.0,<1",
  "fmpy==0.3.32",
  "websockets>=17.1,<18",
  "pydantic>=2.13.5,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=7.1,<8", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
