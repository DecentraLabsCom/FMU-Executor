<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Export Smart Warehouse scene</title>
    <style>
      :root { color-scheme: dark; font: 14px/1.5 system-ui, sans-serif; background: #08151c; color: #eaf4f2; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: auto minmax(360px, 1fr); }
      header { padding: 14px 20px; border-bottom: 1px solid #28434b; }
      h1 { margin: 0; font-size: 16px; }
      #status { margin-top: 4px; color: #8ed9ca; font: 12px ui-monospace, monospace; }
      #preview { min-height: 0; }
      #preview canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <header>
      <h1>Smart Warehouse · Three.js GLB export</h1>
      <div id="status">Building scene…</div>
    </header>
    <div id="preview"></div>
    <script type="module" src="./export-scene.js"></script>
  </body>
</html>
