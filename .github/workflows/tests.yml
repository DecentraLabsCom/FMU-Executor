name: FMU Executor Tests

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install --editable ".[test,lint]"

      - name: Check unused Python imports and local variables
        run: python -m ruff check .

      - name: Run tests with coverage baseline
        # v0.3.6 Actions measured 60.71%; local Python 3.13 measured 60.50%.
        # Keep a cross-environment regression margin until coverage improves.
        run: >-
          python -m pytest tests examples/smart-warehouse-cell/test_archive_utils.py -q
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=60
