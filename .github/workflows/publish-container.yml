name: Publish FMU Executor container

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          source_version="$(cat VERSION)"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$tag_version" != "$source_version" || "$tag_version" != "$package_version" ]]; then
            echo "Tag v${tag_version} must match VERSION (${source_version}) and pyproject.toml (${package_version})." >&2
            exit 1
          fi
          echo "value=${tag_version}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$CR_PAT" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish versioned image
        env:
          IMAGE: ghcr.io/decentralabscom/fmu-executor
          IMAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --build-arg VERSION="$IMAGE_VERSION" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag "$IMAGE:$IMAGE_VERSION" \
            .
          docker push "$IMAGE:$IMAGE_VERSION"
